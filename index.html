<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>একটু প্রশ্ন... 💌</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Segoe UI",
        "Noto Sans Bengali",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,150,205,.32),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(151,132,255,.30),
            transparent 35%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255,220,239,.28),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #fff5fa,
            #f3efff
        );

    position:relative;
}


/* =====================================================
   ROMANTIC BACKGROUND GLOW
===================================================== */

.glow{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    filter:blur(100px);

    opacity:.35;

    animation:
        glowMove 12s
        ease-in-out
        infinite
        alternate;
}

.glow.one{

    width:430px;
    height:430px;

    background:#ff79b4;

    left:-220px;
    top:-200px;
}

.glow.two{

    width:430px;
    height:430px;

    background:#8e7cff;

    right:-220px;
    bottom:-220px;

    animation-delay:3s;
}

.glow.three{

    width:280px;
    height:280px;

    background:#ffc7e3;

    left:40%;
    top:30%;

    opacity:.20;

    animation-duration:17s;
}

@keyframes glowMove{

    0%{
        transform:
            translate(0,0)
            scale(1);
    }

    100%{
        transform:
            translate(100px,70px)
            scale(1.3);
    }

}


/* =====================================================
   LIGHT ORBS
===================================================== */

.orb{

    position:fixed;

    width:8px;
    height:8px;

    border-radius:50%;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 0 15px
        rgba(255,255,255,.9);

    pointer-events:none;

    opacity:.5;

    animation:
        orbFloat
        linear
        infinite;
}

@keyframes orbFloat{

    0%{
        transform:
            translateY(100vh)
            scale(.4);

        opacity:0;
    }

    15%{
        opacity:.7;
    }

    80%{
        opacity:.4;
    }

    100%{
        transform:
            translateY(-20vh)
            scale(1.5);

        opacity:0;
    }

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.particle{

    position:fixed;

    bottom:-50px;

    pointer-events:none;

    z-index:2;

    opacity:0;

    animation:
        particleFloat
        linear
        forwards;
}

@keyframes particleFloat{

    0%{

        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0)
            scale(.3);
    }

    15%{
        opacity:.8;
    }

    70%{
        opacity:.55;
    }

    100%{

        opacity:0;

        transform:
            translateY(-120vh)
            translateX(
                calc(
                    var(--drift) * 1px
                )
            )
            rotate(45deg)
            scale(1.25);
    }

}


/* =====================================================
   CARD
===================================================== */

.question{

    width:min(92%,580px);

    min-height:430px;

    padding:
        55px 35px 40px;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    z-index:10;

    text-align:center;

    border-radius:38px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.72),
            rgba(255,255,255,.38)
        );

    backdrop-filter:
        blur(30px)
        saturate(145%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(145%);

    border:
        1px solid
        rgba(255,255,255,.85);

    box-shadow:

        0 35px 100px
        rgba(70,45,90,.17),

        inset 0 1px 0
        rgba(255,255,255,.95),

        0 0 0 1px
        rgba(255,255,255,.2);

    animation:
        cardEnter
        1.2s
        cubic-bezier(.16,1,.3,1);

    transition:
        transform .6s ease,
        box-shadow .6s ease;
}


/* Card shining line */

.question::after{

    content:"";

    position:absolute;

    width:60%;

    height:1px;

    top:0;

    left:-70%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.9),
            transparent
        );

    animation:
        shine 5s
        ease-in-out
        infinite;

}

@keyframes shine{

    0%{
        left:-70%;
    }

    45%,100%{
        left:120%;
    }

}

@keyframes cardEnter{

    0%{

        opacity:0;

        transform:
            translateY(80px)
            scale(.78)
            rotateX(10deg);

        filter:blur(8px);
    }

    65%{

        transform:
            translateY(-8px)
            scale(1.03)
            rotateX(0);

        filter:blur(0);
    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =====================================================
   CONTENT
===================================================== */

.question-content{

    width:100%;

    position:relative;

    z-index:3;

    animation:
        contentIn
        .8s
        cubic-bezier(.16,1,.3,1);
}

.question-content.out{

    animation:
        contentOut
        .4s
        ease
        forwards;
}

@keyframes contentIn{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes contentOut{

    to{

        opacity:0;

        transform:
            translateY(-25px)
            scale(.96);
    }

}


/* =====================================================
   TEXT
===================================================== */

.eyebrow{

    display:inline-block;

    font-size:11px;

    letter-spacing:4px;

    color:#a56b91;

    margin-bottom:18px;

    text-transform:uppercase;

    opacity:.9;
}

h1{

    font-size:
        clamp(
            30px,
            7vw,
            51px
        );

    line-height:1.18;

    letter-spacing:-1px;

    color:#403344;

    margin-bottom:20px;

    text-shadow:
        0 4px 20px
        rgba(100,60,90,.08);
}

.subtitle{

    max-width:430px;

    margin:
        0 auto 32px;

    color:#7e6d7c;

    font-size:15px;

    line-height:1.85;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn-row{

    min-height:60px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:14px;
}

button{

    border:none;

    outline:none;

    cursor:pointer;

    min-width:125px;

    padding:
        15px 28px;

    border-radius:50px;

    font-size:16px;

    font-weight:650;

    font-family:inherit;

    transition:
        transform .3s
        cubic-bezier(.16,1,.3,1),
        box-shadow .3s ease;

    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   YES
===================================================== */

.yes{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff76b1,
            #ff3b80
        );

    box-shadow:
        0 13px 35px
        rgba(255,65,130,.28);

    animation:
        yesGlow
        2.5s
        ease-in-out
        infinite;
}

@keyframes yesGlow{

    0%,100%{

        box-shadow:
            0 13px 35px
            rgba(255,65,130,.22);
    }

    50%{

        box-shadow:

            0 16px 42px
            rgba(255,65,130,.40),

            0 0 0 9px
            rgba(255,65,130,.06);
    }

}

.yes:hover{

    transform:
        translateY(-5px)
        scale(1.06);
}

.yes:active{

    transform:
        scale(.90);
}


/* =====================================================
   NO
===================================================== */

.no{

    color:#665767;

    background:
        rgba(255,255,255,.88);

    box-shadow:
        0 9px 25px
        rgba(50,35,60,.08);
}

.no:hover{

    transform:
        translateY(-4px);
}

.no:active{

    transform:
        scale(.92);
}


/* =====================================================
   HINT
===================================================== */

.hint{

    min-height:27px;

    margin-top:21px;

    color:#a16c89;

    font-size:14px;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:6px;

    margin-top:28px;
}

.dot{

    width:6px;
    height:6px;

    border-radius:10px;

    background:#ddd3dc;

    transition:
        all .45s
        cubic-bezier(.16,1,.3,1);
}

.dot.active{

    width:25px;

    background:#ff69a6;

    box-shadow:
        0 0 12px
        rgba(255,105,166,.35);
}


/* =====================================================
   FINAL SCREEN
===================================================== */

.final{

    width:100%;

    animation:
        finalIn
        1.2s
        cubic-bezier(.16,1,.3,1);
}

@keyframes finalIn{

    0%{

        opacity:0;

        transform:
            scale(.5)
            translateY(40px);

        filter:blur(10px);
    }

    65%{

        transform:
            scale(1.05);

        filter:blur(0);
    }

    100%{

        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}

.big-heart{

    display:block;

    font-size:82px;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(255,70,130,.22)
        );

    animation:
        heartBeat
        1.7s
        ease-in-out
        infinite;
}

@keyframes heartBeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.10);
    }

}

.final-text{

    max-width:440px;

    margin:auto;

    color:#756574;

    font-size:15px;

    line-height:1.9;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:520px){

    .question{

        width:92%;

        min-height:400px;

        padding:
            45px 22px 35px;

        border-radius:30px;
    }

    .btn-row{

        gap:9px;
    }

    button{

        min-width:105px;

        padding:
            13px 18px;

        font-size:15px;
    }

    .subtitle{

        font-size:14px;

        line-height:1.75;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="glow one"></div>
<div class="glow two"></div>
<div class="glow three"></div>


<!-- =====================================================
     MAIN CARD
===================================================== -->

<div
    class="question"
    id="questionBox"
>

    <div
        class="question-content"
        id="content"
    >

        <p class="eyebrow">

        >
            কোনো চাপ নেই...

        </p>


        <div class="btn-row">

            <button
                class="yes"
                id="yesButton"

                হ্যাঁ ❤️

        </p>


        <div
            class="progress"
            id="progress"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        question:
            "তুমি কি আমাকে ভালোবাসবে? ❤️",

        subtitle:
            "কোনো চাপ নেই... শুধু মন থেকে উত্তর দিও। 🤍"
    },

    {
        question:
            "আবার যদি প্রথমবার দেখা হতো,তাহলে কি আমাকে বেছে নিতে? 🫶",

        subtitle:
            "সবকিছু নতুন করে শুরু করার সুযোগ পেলে?"
    },

    {
        question:
            "আমার নাম দেখলে কি তোমার মুখে একটু হাসি আসে? 😊",

        subtitle:
            "সত্যি করে বলো... আমি কিন্তু বিচার করব না।"
    },

    {
        question:
            "আমাদের ছোট ছোট মুহূর্তগুলো কি তুমি মনে রাখবে? 🌷",

        subtitle:
            "কিছু মুহূর্ত ছোট হলেও,মনের কাছে অনেক বড় হয়ে থাকে।"
    },

    {
        question:
            "কঠিন সময় এলেও কি পাশে থাকবে? 🌙",

        subtitle:
            "কারণ সুন্দর সম্পর্ক শুধু ভালো সময়ের জন্য নয়।"
    },

    {
        question:
            "তোমার হৃদয়ে কি আমার জন্য একটু জায়গা থাকবে? 💗",

        subtitle:
            "খুব বেশি জায়গা নয়... শুধু একটু বিশেষ জায়গা।"
    },

    {
        question:
            "আরেকটা সুন্দর স্মৃতি একসাথে তৈরি করার সুযোগ পেলে কি করবে? ✨",

        subtitle:
            "হয়তো সাধারণ একটা মুহূর্তই একদিন সবচেয়ে সুন্দর স্মৃতি হয়ে যাবে।"
    },

    {
        question:
            "আমার সঙ্গে কিছু সুন্দর মুহূর্ত ভাগ করে নিতে চাইবে? 🌸",

        subtitle:
            "কারণ কারও সঙ্গে আনন্দ ভাগ করে নিলে আনন্দটা আরও সুন্দর হয়ে যায়।"
    },

    {
        question:
            "এই ছোট্ট প্রশ্নগুলোর মাঝে যদি একবারও হাসো...তাহলে কি শেষ পর্যন্ত থাকবে? 💌",

        subtitle:
            "কারণ শেষ প্রশ্নটার উত্তর হয়তো একটু বেশি বিশেষ। ✨"
    }

];


let currentQuestion = 0;
let noCount = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const questionBox =
    document.getElementById(
        "questionBox"
    );

const content =
    document.getElementById(
        "content"
    );

const questionText =
    document.getElementById(
        "questionText"
    );

const subtitle =
    document.getElementById(
        "subtitle"
    );

const yesButton =
    document.getElementById(
        "yesButton"
    );

const noButton =
    document.getElementById(
        "noButton"
    );

const hint =
    document.getElementById(
        "hint"
    );

const progress =
    document.getElementById(
        "progress"
    );


/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioContext = null;

let backgroundGain = null;


/* =====================================================
   INITIALIZE AUDIO
===================================================== */

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* =====================================================
   ROMANTIC BACKGROUND AMBIENCE
===================================================== */

function startBackgroundMusic(){

    initAudio();


    if(backgroundGain){

        return;

    }


    const now =
        audioContext.currentTime;


    backgroundGain =
        audioContext.createGain();


    backgroundGain.gain.setValueAtTime(
        0,
        now
    );


    backgroundGain.gain.linearRampToValueAtTime(
        0.025,
        now + 3
    );


    backgroundGain.connect(
        audioContext.destination
    );


    /*
       Very soft ambient pad
    */

    const notes = [

        261.63,
        329.63,
        392.00,
        523.25

    ];


    notes.forEach(
        (frequency,index)=>{

            const oscillator =
                audioContext.createOscillator();


            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.value =
                frequency;


            gain.gain.value =
                0.12;


            oscillator.connect(gain);

            gain.connect(
                backgroundGain
            );


            oscillator.start();


            /*
               Keep the oscillator alive.
            */

        }
    );


    /*
       Slow ambient shimmer
    */

    const shimmer =
        audioContext.createOscillator();


    const shimmerGain =
        audioContext.createGain();


    shimmer.type =
        "sine";


    shimmer.frequency.value =
        880;


    shimmerGain.gain.value =
        0.018;


    shimmer.connect(
        shimmerGain
    );


    shimmerGain.connect(
        backgroundGain
    );


    shimmer.start();

}


/* =====================================================
   YES SOUND
===================================================== */

function playYesSound(){

    initAudio();

    startBackgroundMusic();


    const now =
        audioContext.currentTime;


    const master =
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );


    master.gain.linearRampToValueAtTime(
        0.20,
        now + .04
    );


    master.gain.exponentialRampToValueAtTime(
        .001,
        now + 1.8
    );


    master.connect(
        audioContext.destination
    );


    /*
       Romantic ascending notes
    */

    const notes = [

        523.25,
        659.25,
        783.99,
        1046.50

    ];


    notes.forEach(
        (frequency,index)=>{

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0,
                now + index*.08
            );


            gain.gain.linearRampToValueAtTime(
                .7,
                now + index*.08 + .04
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now + 1.5
            );


            osc.connect(gain);

            gain.connect(master);


            osc.start(
                now + index*.08
            );


            osc.stop(
                now + 1.8
            );

        }
    );

}


/* =====================================================
   NO SOUND
===================================================== */

function playNoSound(){

    initAudio();

    startBackgroundMusic();


    const now =
        audioContext.currentTime;


    const master =
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );


    master.gain.linearRampToValueAtTime(
        .15,
        now+.05
    );


    master.gain.exponentialRampToValueAtTime(
        .001,
        now+1.4
    );


    master.connect(
        audioContext.destination
    );


    const notes = [

        440,
        369.99,
        329.63,
        293.66

    ];


    notes.forEach(
        (frequency,index)=>{

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0,
                now+index*.14
            );


            gain.gain.linearRampToValueAtTime(
                .6,
                now+index*.14+.04
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+index*.14+.65
            );


            osc.connect(gain);

            gain.connect(master);


            osc.start(
                now+index*.14
            );


            osc.stop(
                now+index*.14+.7
            );

        }
    );

}


/* =====================================================
   FINAL SOUND
===================================================== */

function playFinalSound(){

    initAudio();


    const now =
        audioContext.currentTime;


    const master =
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );


    master.gain.linearRampToValueAtTime(
        .22,
        now+.08
    );


    master.gain.exponentialRampToValueAtTime(
        .001,
        now+3
    );


    master.connect(
        audioContext.destination
    );


    const notes = [

        261.63,
        329.63,
        392,
        523.25,
        659.25

    ];


    notes.forEach(
        (frequency,index)=>{

            const osc =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0,
                now+index*.12
            );


            gain.gain.linearRampToValueAtTime(
                .55,
                now+index*.12+.06
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+2.7
            );


            osc.connect(gain);

            gain.connect(master);


            osc.start(
                now+index*.12
            );


            osc.stop(
                now+3
            );

        }
    );

}


/* =====================================================
   PROGRESS
===================================================== */

function createProgress(){

    progress.innerHTML = "";


    questions.forEach(
        (_,index)=>{

            const dot =
                document.createElement(
                    "span"
                );


            dot.className =
                "dot";


            if(
                index ===
                currentQuestion
            ){

                dot.classList.add(
                    "active"
                );

            }


            progress.appendChild(
                dot
            );

        }
    );

}

createProgress();


/* =====================================================
   RESET NO
===================================================== */

function resetNo(){

    noButton.style.position =
        "static";

    noButton.style.left =
        "";

    noButton.style.top =
        "";

    noButton.style.transform =
        "";

    noButton.style.transition =
        "";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    content.classList.add(
        "out"
    );


    setTimeout(()=>{

        currentQuestion++;


        if(
            currentQuestion >=
            questions.length
        ){

            showFinal();

            return;

        }


        questionText.textContent =
            questions[
                currentQuestion
            ].question;


        subtitle.textContent =
            questions[
                currentQuestion
            ].subtitle;


        hint.innerHTML =
            "&nbsp;";


        resetNo();


        createProgress();


        content.classList.remove(
            "out"
        );


        content.classList.remove(
            "question-content"
        );


        void content.offsetWidth;


        content.classList.add(
            "question-content"
        );


    },420);

}

/* =====================================================
   PARTICLE SYSTEM
===================================================== */

const symbols = [

    "♡",
    "♥",
    "💕",
    "💗",
    "💖",
    "✨",
    "✦",
    "·"

];


function createParticle(){

    const particle =
        document.createElement(
            "div"
        );


    particle.className =
        "particle";


    particle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    particle.style.left =
        Math.random()*100+
        "vw";


    particle.style.fontSize =
        (
            10+
            Math.random()*24
        )+
        "px";


    particle.style.animationDuration =
        (
            5+
            Math.random()*7
        )+
        "s";


    particle.style.setProperty(
        "--drift",
        Math.random()*180-90
    );


    document.body.appendChild(
        particle
    );


    setTimeout(
        ()=>{
            particle.remove();
        },
        13000
    );

}


/* =====================================================
   CONTINUOUS PARTICLES
===================================================== */

setInterval(
    createParticle,
    650
);


/* =====================================================
   HEART EXPLOSION
===================================================== */

function heartExplosion(){

    for(
        let i=0;
        i<40;
        i++
    ){

        setTimeout(
            createParticle,
            i*22
        );

    }

}
