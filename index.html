<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff1f7">

<title>তোমার জন্য একটি ছোট্ট প্রশ্ন 💌</title>

<style>

/* ================================
   BASIC
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        "Noto Sans Bengali",
        "Hind Siliguri",
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,120,180,.35),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(130,110,255,.30),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff5fa,
            #f5f1ff
        );

    position:relative;
}


/* ================================
   BACKGROUND GLOW
================================ */

.glow{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(90px);
    opacity:.35;
}

.glow1{
    width:420px;
    height:420px;
    background:#ff7eb7;
    left:-220px;
    top:-180px;

    animation:
        moveGlow1
        10s
        ease-in-out
        infinite
        alternate;
}

.glow2{
    width:420px;
    height:420px;
    background:#8b7cff;
    right:-220px;
    bottom:-200px;

    animation:
        moveGlow2
        13s
        ease-in-out
        infinite
        alternate;
}

.glow3{
    width:260px;
    height:260px;
    background:#ffc5e0;
    left:45%;
    top:35%;
    opacity:.18;

    animation:
        pulseGlow
        7s
        ease-in-out
        infinite;
}

@keyframes moveGlow1{

    from{
        transform:
            translate(0,0)
            scale(1);
    }

    to{
        transform:
            translate(100px,80px)
            scale(1.3);
    }
}

@keyframes moveGlow2{

    from{
        transform:
            translate(0,0)
            scale(1);
    }

    to{
        transform:
            translate(-90px,-70px)
            scale(1.25);
    }
}

@keyframes pulseGlow{

    0%,100%{
        transform:scale(1);
        opacity:.12;
    }

    50%{
        transform:scale(1.35);
        opacity:.25;
    }
}


/* ================================
   FLOATING HEARTS
================================ */

.floating{
    position:fixed;

    bottom:-50px;

    pointer-events:none;

    z-index:2;

    opacity:0;

    animation:
        floatUp
        linear
        forwards;
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            scale(.4)
            rotate(0deg);
    }

    15%{
        opacity:.75;
    }

    70%{
        opacity:.55;
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(var(--move))
            scale(1.3)
            rotate(40deg);
    }
}


/* ================================
   CARD
================================ */

.card{

    width:min(92%,570px);

    min-height:440px;

    padding:
        52px 30px 38px;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
    z-index:10;

    text-align:center;

    border-radius:36px;

    background:
        rgba(255,255,255,.62);

    backdrop-filter:
        blur(28px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(150%);

    border:
        1px solid
        rgba(255,255,255,.85);

    box-shadow:
        0 35px 90px
        rgba(75,45,90,.18),

        inset 0 1px 0
        rgba(255,255,255,.95);

    animation:
        cardShow
        1.2s
        cubic-bezier(.16,1,.3,1);
}


/* Moving shine */

.card::after{

    content:"";

    position:absolute;

    width:65%;
    height:2px;

    top:0;
    left:-70%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.95),
            transparent
        );

    animation:
        shine
        5s
        ease-in-out
        infinite;
}

@keyframes shine{

    0%{
        left:-70%;
    }

    45%,100%{
        left:120%;
    }
}

@keyframes cardShow{

    0%{
        opacity:0;

        transform:
            translateY(80px)
            scale(.75);

        filter:blur(10px);
    }

    70%{
        transform:
            translateY(-8px)
            scale(1.03);

        filter:blur(0);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ================================
   CONTENT
================================ */

.content{
    width:100%;

    animation:
        contentIn
        .8s
        cubic-bezier(.16,1,.3,1);
}

.content.hide{
    animation:
        contentOut
        .4s
        ease
        forwards;
}

@keyframes contentIn{

    from{
        opacity:0;

        transform:
            translateY(30px)
            scale(.94);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes contentOut{

    to{
        opacity:0;

        transform:
            translateY(-25px)
            scale(.96);
    }
}


/* ================================
   TEXT
================================ */

.eyebrow{

    display:inline-block;

    margin-bottom:17px;

    font-size:11px;

    letter-spacing:3px;

    color:#a66b91;

    text-transform:uppercase;
}

h1{

    color:#403344;

    font-size:
        clamp(30px,7vw,49px);

    line-height:1.2;

    letter-spacing:-1px;

    margin-bottom:18px;

    text-shadow:
        0 5px 20px
        rgba(90,50,80,.08);
}

.subtitle{

    max-width:440px;

    margin:
        0 auto 30px;

    color:#7c6d7b;

    font-size:15px;

    line-height:1.85;
}


/* ================================
   BUTTON AREA
================================ */

.buttons{

    min-height:60px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:13px;
}

button{

    border:0;
    outline:0;

    cursor:pointer;

    min-width:120px;

    padding:
        14px 25px;

    border-radius:50px;

    font-family:inherit;

    font-size:16px;

    font-weight:700;

    transition:
        transform .3s
        cubic-bezier(.16,1,.3,1),
        box-shadow .3s ease;

    -webkit-tap-highlight-color:transparent;
}


/* ================================
   YES BUTTON
================================ */

#yes{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff78b4,
            #ff3d82
        );

    box-shadow:
        0 12px 32px
        rgba(255,55,125,.30);

    animation:
        yesPulse
        2.3s
        ease-in-out
        infinite;
}

@keyframes yesPulse{

    0%,100%{
        box-shadow:
            0 12px 32px
            rgba(255,55,125,.22);
    }

    50%{
        box-shadow:
            0 16px 40px
            rgba(255,55,125,.42),

            0 0 0 9px
            rgba(255,70,135,.06);
    }
}

#yes:hover{

    transform:
        translateY(-5px)
        scale(1.06);
}

#yes:active{

    transform:
        scale(.9);
}


/* ================================
   NO BUTTON
================================ */

#no{

    color:#665766;

    background:
        rgba(255,255,255,.9);

    box-shadow:
        0 9px 22px
        rgba(50,35,60,.08);
}

#no:hover{

    transform:
        translateY(-4px);
}

#no:active{

    transform:scale(.92);
}


/* ================================
   HINT
================================ */

.hint{

    min-height:26px;

    margin-top:20px;

    color:#a16b89;

    font-size:14px;

    animation:
        hintIn
        .4s
        ease;
}

@keyframes hintIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* ================================
   PROGRESS
================================ */

.progress{

    margin-top:26px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;
}

.dot{

    width:6px;
    height:6px;

    border-radius:10px;

    background:#ddd4dc;

    transition:
        .45s
        cubic-bezier(.16,1,.3,1);
}

.dot.active{

    width:24px;

    background:#ff69a6;

    box-shadow:
        0 0 12px
        rgba(255,100,165,.4);
}


/* ================================
   FINAL SCREEN
================================ */

.final{

    width:100%;

    animation:
        finalShow
        1.2s
        cubic-bezier(.16,1,.3,1);
}

@keyframes finalShow{

    0%{
        opacity:0;

        transform:
            scale(.5)
            translateY(40px);

        filter:blur(8px);
    }

    65%{
        transform:
            scale(1.05);

        filter:blur(0);
    }

    100%{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }
}

.heart{

    display:block;

    font-size:80px;

    margin-bottom:15px;

    animation:
        heartbeat
        1.6s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(255,50,120,.25)
        );
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.1);
    }
}

.final-text{

    max-width:430px;

    margin:auto;

    color:#756674;

    font-size:15px;

    line-height:1.9;
}


/* ================================
   MOBILE
================================ */

@media(max-width:520px){

    .card{

        width:92%;

        min-height:410px;

        padding:
            43px 20px 32px;

        border-radius:30px;
    }

    .buttons{
        gap:9px;
    }

    button{

        min-width:105px;

        padding:
            13px 18px;

        font-size:15px;
    }

    .subtitle{

        font-size:14px;
    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>


<!-- MAIN CARD -->

<div class="card" id="card">

    <div class="content" id="content">

        <p class="eyebrow">
            তোমার জন্য ছোট্ট কিছু প্রশ্ন 💌
        </p>

        <h1 id="question">
            তুমি কি আমাকে ভালোবাসবে? ❤️
        </h1>

        <p class="subtitle" id="subtitle">
            কোনো চাপ নেই...
            শুধু মন থেকে উত্তর দিও। 🤍
        </p>

        <div class="buttons">

            <button id="yes">
                হ্যাঁ ❤️
            </button>

            <button id="no">
                না
            </button>

        </div>

        <p class="hint" id="hint">
            &nbsp;
        </p>

        <div class="progress" id="progress"></div>

    </div>

</div>


<script>

/* =====================================================
   প্রশ্নগুলোর তালিকা
===================================================== */

const questions = [

    {
        q:"তুমি কি আমাকে ভালোবাসবে? ❤️",
        s:"কোনো চাপ নেই... শুধু মন থেকে উত্তর দিও। 🤍"
    },

    {
        q:"আবার যদি প্রথমবার দেখা হতো,তাহলে কি আমাকে বেছে নিতে? 🫶",
        s:"সবকিছু নতুন করে শুরু করার সুযোগ পেলে?"
    },

    {
        q:"আমার নাম দেখলে কি তোমার মুখে একটু হাসি আসে? 😊",
        s:"সত্যি করে বলো... তোমার উত্তরটা জানতে ইচ্ছে করছে।"
    },

    {
        q:"আমাদের ছোট ছোট মুহূর্তগুলো কি তুমি মনে রাখবে? 🌷",
        s:"কিছু মুহূর্ত ছোট হলেও,মনের কাছে অনেক বড় হয়ে থাকে।"
    },

    {
        q:"মন খারাপের দিনে কি আমার সঙ্গে একটু কথা বলতে চাইবে? 🌙",
        s:"কখনো কখনো একটা ছোট্ট কথাই মনটা ভালো করে দিতে পারে।"
    },

    {
        q:"কঠিন সময় এলেও কি আমার পাশে থাকবে? 🤍",
        s:"কারণ সুন্দর সম্পর্ক শুধু ভালো সময়ের জন্য নয়।"
    },

    {
        q:"তোমার হৃদয়ে কি আমার জন্য একটু বিশেষ জায়গা থাকবে? 💗",
        s:"খুব বেশি জায়গা নয়... শুধু একটু বিশেষ জায়গা।"
    },

    {
        q:"আমার সঙ্গে আরও অনেক সুন্দর স্মৃতি তৈরি করতে চাইবে? ✨",
        s:"হয়তো আজকের এই ছোট্ট মুহূর্তটাও একদিন স্মৃতি হয়ে যাবে।"
    },

    {
        q:"আমার সঙ্গে হাসতে,গল্প করতে আর কিছু সুন্দর সময় কাটাতে চাইবে? 🌸",
        s:"কারণ সুন্দর সময় ভাগ করে নিলে মুহূর্তগুলো আরও সুন্দর হয়।"
    },

    {
        q:"শেষ একটা প্রশ্ন...আমি যদি তোমাকে থাকতে বলি,তুমি কি থাকবে? 💌",
        s:"এই প্রশ্নটার উত্তরটা হয়তো সবচেয়ে বেশি জানতে ইচ্ছে করছে।"
    }

];


let current = 0;
let noCount = 0;


/* =====================================================
   ELEMENT
===================================================== */

const question =
    document.getElementById("question");

const subtitle =
    document.getElementById("subtitle");

const yes =
    document.getElementById("yes");

const no =
    document.getElementById("no");

const hint =
    document.getElementById("hint");

const content =
    document.getElementById("content");

const progress =
    document.getElementById("progress");

const card =
    document.getElementById("card");


/* =====================================================
   PROGRESS DOTS
===================================================== */

function updateProgress(){

    progress.innerHTML = "";

    questions.forEach(
        (_,i)=>{

            const dot =
                document.createElement("span");

            dot.className="dot";

            if(i===current){

                dot.classList.add("active");

            }

            progress.appendChild(dot);

        }
    );
}

updateProgress();


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;
let musicStarted = false;


/* Audio initialize */

function audioStart(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state === "suspended"
    ){

        audioContext.resume();

    }

}


/* =====================================================
   ROMANTIC BACKGROUND SOUND
===================================================== */

function startMusic(){

    audioStart();

    if(musicStarted) return;

    musicStarted = true;

    const master =
        audioContext.createGain();

    master.gain.value=.018;

    master.connect(
        audioContext.destination
    );


    const notes=[
        261.63,
        329.63,
        392,
        523.25
    ];


    notes.forEach(
        (frequency,i)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type="sine";

            oscillator.frequency.value=
                frequency;


            gain.gain.value=.15;


            oscillator.connect(gain);

            gain.connect(master);

            oscillator.start();

        }
    );

}


/* =====================================================
   YES SOUND
===================================================== */

function yesSound(){

    audioStart();

    startMusic();

    const now=
        audioContext.currentTime;

    const notes=[
        523.25,
        659.25,
        783.99,
        1046.50
    ];


    notes.forEach(
        (frequency,i)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type="sine";

            oscillator.frequency.value=
                frequency;


            gain.gain.setValueAtTime(
                0,
                now+i*.08
            );


            gain.gain.linearRampToValueAtTime(
                .35,
                now+i*.08+.04
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+1.5
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                now+i*.08
            );


            oscillator.stop(
                now+1.6
            );

        }
    );

}


/* =====================================================
   NO SOUND
===================================================== */

function noSound(){

    audioStart();

    startMusic();

    const now=
        audioContext.currentTime;


    const notes=[
        440,
        392,
        349.23,
        293.66
    ];


    notes.forEach(
        (frequency,i)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type="sine";

            oscillator.frequency.value=
                frequency;


            gain.gain.setValueAtTime(
                0,
                now+i*.13
            );


            gain.gain.linearRampToValueAtTime(
                .25,
                now+i*.13+.04
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+i*.13+.65
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                now+i*.13
            );


            oscillator.stop(
                now+i*.13+.7
            );

        }
    );

}


/* =====================================================
   FINAL SOUND
===================================================== */

function finalSound(){

    audioStart();

    const now=
        audioContext.currentTime;


    const notes=[
        261.63,
        329.63,
        392,
        523.25,
        659.25
    ];


    notes.forEach(
        (frequency,i)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type="sine";

            oscillator.frequency.value=
                frequency;


            gain.gain.setValueAtTime(
                0,
                now+i*.12
            );


            gain.gain.linearRampToValueAtTime(
                .3,
                now+i*.12+.06
            );


            gain.gain.exponentialRampToValueAtTime(
                .001,
                now+2.7
            );


            oscillator.connect(gain);

            gain.connect(
                audioContext.destination
            );


            oscillator.start(
                now+i*.12
            );


            oscillator.stop(
                now+3
            );

        }
    );

}


/* =====================================================
   HEART PARTICLES
===================================================== */

const symbols=[
    "♡",
    "♥",
    "💕",
    "💗",
    "💖",
    "✨",
    "✦"
];


function particle(){

    const p=
        document.createElement("div");

    p.className="floating";


    p.textContent=
        symbols[
            Math.floor(
                Math.random()*
                symbols.length
            )
        ];


    p.style.left=
        Math.random()*100+
        "vw";


    p.style.fontSize=
        12+
        Math.random()*23+
        "px";


    p.style.animationDuration=
        5+
        Math.random()*7+
        "s";


    p.style.setProperty(
        "--move",
        Math.random()*180-90+
        "px"
    );


    document.body.appendChild(p);


    setTimeout(
        ()=>{
            p.remove();
        },
        13000
    );

}


/* continuously */

setInterval(
    particle,
    650
);


/* initial */

for(
    let i=0;
    i<15;
    i++
){

    setTimeout(
        particle,
        i*180
    );

}


/* =====================================================
   HEART EXPLOSION
===================================================== */

function heartExplosion(){

    for(
        let i=0;
        i<45;
        i++
    ){

        setTimeout(
            particle,
            i*20
        );

    }

}


/* =====================================================
   RESET NO BUTTON
===================================================== */

function resetNo(){

    no.style.position="static";

    no.style.left="";

    no.style.top="";

    no.style.transform="";

    no.style.transition="";
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    content.classList.add("hide");


    setTimeout(()=>{

        current++;


        if(
            current >=
            questions.length
        ){

            finalScreen();

            return;
        }


        question.textContent=
            questions[current].q;


        subtitle.textContent=
            questions[current].s;


        hint.innerHTML="&nbsp;";


        resetNo();


        updateProgress();


        content.classList.remove("hide");

        content.classList.remove("content");

        void content.offsetWidth;

        content.classList.add("content");


    },400);

}

        yesSound();

            "scale(.9)";


        setTimeout(
            ()=>{
                yes.style.transform="";

        );


        setTimeout(
            nextQuestion,
            550
        );

    }
);

    "হুম...এই উত্তরটা কিন্তু আমার মন মানছে না। 🥹",

    "আমার মনে হচ্ছে তুমি একটু দুষ্টুমি করছো। 😭",

    "আরেকটা সুযোগ নাও... 🫶",

    "আচ্ছা...শেষবারের মতো ভেবে দেখো। 🤍"

];


no.addEventListener(
    "click",
    ()=>{

        audioStart();

        startMusic();

        noSound();


        noCount++;


        hint.textContent=
            noMessages[
                Math.min(
                    noCount-1,
                    noMessages.length-1
                )
            ];


        no.style.position="fixed";


        const padding=20;


        const maxX=
            window.innerWidth-
            no.offsetWidth-
            padding;


        const maxY=
            window.innerHeight-
            no.offsetHeight-
            padding;


        const x=
            padding+
            Math.random()*
            Math.max(
                1,
                maxX-padding
            );


        const y=
            padding+
            Math.random()*
            Math.max(
                1,
                maxY-padding
            );


        no.style.transition=
            "left .6s cubic-bezier(.16,1,.3,1),top .6s cubic-bezier(.16,1,.3,1),transform .35s ease";


        no.style.left=
            x+"px";


        no.style.top=
            y+"px";


        no.style.transform=
            "rotate("+
            (
                Math.random()*20-10
            )+
            "deg) scale(1.08)";


        setTimeout(
            ()=>{
                no.style.transform=
                    "rotate(0deg) scale(1)";
            },
            600
        );

    }
);
