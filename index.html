<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question For You 💌</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #ffc1df55, transparent 35%),
        radial-gradient(circle at 85% 80%, #b9a7ff55, transparent 35%),
        linear-gradient(135deg,#fff4fa,#f5f1ff);

    position:relative;
}


/* =========================
   BACKGROUND
========================= */

.bg-glow{
    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    filter:blur(100px);

    opacity:.35;

    animation:
        glowMove 10s ease-in-out infinite alternate;
}

.glow-one{
    background:#ff83bd;
    top:-160px;
    left:-120px;
}

.glow-two{
    background:#8f7cff;
    bottom:-170px;
    right:-120px;

    animation-delay:3s;
}

@keyframes glowMove{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(70px,50px) scale(1.25);
    }

}


/* =========================
   FLOATING PARTICLES
========================= */

.particle{
    position:fixed;

    pointer-events:none;

    z-index:1;

    opacity:0;

    animation:
        particleFloat linear forwards;
}

@keyframes particleFloat{

    0%{
        transform:
            translateY(20px)
            scale(.4)
            rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:.7;
    }

    80%{
        opacity:.5;
    }

    100%{
        transform:
            translateY(-110vh)
            scale(1.3)
            rotate(40deg);

        opacity:0;
    }

}


/* =========================
   CARD
========================= */

.question{

    width:min(92%,520px);

    padding:55px 35px;

    text-align:center;

    position:relative;

    z-index:5;

    background:
        rgba(255,255,255,.58);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    border:
        1px solid rgba(255,255,255,.8);

    border-radius:32px;

    box-shadow:
        0 30px 80px rgba(80,50,100,.16),
        inset 0 1px 0 rgba(255,255,255,.8);

    animation:
        cardEnter 1s cubic-bezier(.16,1,.3,1);
}

@keyframes cardEnter{

    0%{
        opacity:0;
        transform:
            translateY(70px)
            scale(.85);
    }

    70%{
        transform:
            translateY(-8px)
            scale(1.02);
    }

    100%{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   QUESTION
========================= */

.question-content{
    animation:
        questionIn .7s cubic-bezier(.16,1,.3,1);
}

.question-content.out{
    animation:
        questionOut .35s ease forwards;
}

@keyframes questionIn{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }

}

@keyframes questionOut{

    to{
        opacity:0;
        transform:
            translateY(-20px)
            scale(.97);
    }

}


/* =========================
   TEXT
========================= */

.eyebrow{

    font-size:12px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#a46c91;

    margin-bottom:18px;
}

h1{

    font-size:
        clamp(30px,7vw,50px);

    line-height:1.1;

    color:#403344;

    margin-bottom:20px;

    letter-spacing:-1px;
}

.subtitle{

    color:#806f7e;

    font-size:15px;

    line-height:1.7;

    max-width:390px;

    margin:
        0 auto 32px;
}


/* =========================
   BUTTONS
========================= */

.btn-row{

    display:flex;

    justify-content:center;

    gap:15px;

    min-height:55px;
}

button{

    border:none;

    outline:none;

    cursor:pointer;

    padding:
        14px 27px;

    min-width:120px;

    border-radius:50px;

    font-size:16px;

    font-weight:600;

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* YES */

.yes{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff72ad,
            #ff3f82
        );

    box-shadow:
        0 10px 28px #ff4d9035;

    animation:
        yesGlow 2.4s ease-in-out infinite;
}

@keyframes yesGlow{

    0%,100%{
        box-shadow:
            0 10px 28px #ff4d9025;
    }

    50%{
        box-shadow:
            0 12px 35px #ff4d9050,
            0 0 0 8px #ff4d9010;
    }

}

.yes:hover{

    transform:
        translateY(-4px)
        scale(1.05);
}

.yes:active{

    transform:
        scale(.92);
}


/* NO */

.no{

    background:
        rgba(255,255,255,.85);

    color:#645866;

    box-shadow:
        0 8px 20px rgba(0,0,0,.07);
}

.no:hover{

    transform:
        translateY(-3px);
}

.no:active{

    transform:scale(.92);
}


/* =========================
   HINT
========================= */

.hint{

    min-height:25px;

    margin-top:22px;

    font-size:14px;

    color:#a56c8b;

    transition:.3s;
}


/* =========================
   PROGRESS
========================= */

.progress{

    display:flex;

    justify-content:center;

    gap:7px;

    margin-top:28px;
}

.dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ddd3dc;

    transition:
        .4s ease;
}

.dot.active{

    width:22px;

    border-radius:10px;

    background:#ff6ba7;
}


/* =========================
   FINAL
========================= */

.final{

    animation:
        finalEnter 1s cubic-bezier(.16,1,.3,1);
}

@keyframes finalEnter{

    0%{
        opacity:0;
        transform:
            scale(.6)
            translateY(30px);
    }

    70%{
        transform:
            scale(1.06);
    }

    100%{
        opacity:1;
        transform:
            scale(1)
            translateY(0);
    }

}

.big-heart{

    display:block;

    font-size:75px;

    margin-bottom:18px;

    animation:
        heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.18);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.12);
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .question{

        padding:
            45px 22px;

        border-radius:27px;
    }

    .btn-row{

        gap:10px;
    }

    button{

        min-width:105px;

        padding:
            13px 20px;
    }

}

</style>
</head>


<body>


<div class="bg-glow glow-one"></div>
<div class="bg-glow glow-two"></div>


<div class="question" id="questionBox">

    <div class="question-content" id="content">

        <p class="eyebrow">
            just a little question
        </p>

        <h1 id="questionText">
            Would you love me?
        </h1>

        <p class="subtitle" id="subtitle">
            No pressure... just answer from your heart. 🤍
        </p>

        <div class="btn-row">

            <button
                class="yes"
                id="yesButton">
                Yes ❤️
            </button>

            <button
                class="no"
                id="noButton">
                No
            </button>

        </div>

        <p
            class="hint"
            id="hint">
            &nbsp;
        </p>

        <div
            class="progress"
            id="progress">
        </div>

    </div>

</div>


<script>


/* =========================
   QUESTIONS
========================= */

const questions = [

    {
        question:
            "Would you love me? ❤️",

        subtitle:
            "No pressure... just answer from your heart. 🤍"
    },

    {
        question:
            "Would you choose me again? 🫶",

        subtitle:
            "Even if you had to meet me all over again..."
    },

    {
        question:
            "Would you stay when things get difficult? 🌙",

        subtitle:
            "Because the best connections aren't only about easy days."
    },

    {
        question:
            "Would you still smile when you see my name? 😊",

        subtitle:
            "Be honest... I promise I won't judge."
    },

    {
        question:
            "Would you keep a little place for me in your heart? 💗",

        subtitle:
            "Maybe that's all I really need to know."
    },

    {
        question:
            "One last question... 💌",

        subtitle:
            "If I asked you to stay, would you?"
    }

];


let currentQuestion = 0;


/* =========================
   ELEMENTS
========================= */

const questionText =
    document.getElementById("questionText");

const subtitle =
    document.getElementById("subtitle");

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");

const hint =
    document.getElementById("hint");

const content =
    document.getElementById("content");

const progress =
    document.getElementById("progress");


/* =========================
   PROGRESS DOTS
========================= */

function createProgress(){

    progress.innerHTML = "";

    questions.forEach(
        (_,index)=>{

            const dot =
                document.createElement("span");

            dot.className =
                "dot";

            if(index === currentQuestion){

                dot.classList.add("active");
            }

            progress.appendChild(dot);
        }
    );
}

createProgress();


/* =========================
   CHANGE QUESTION
========================= */

function nextQuestion(){

    content.classList.add("out");

    setTimeout(()=>{

        currentQuestion++;

        if(
            currentQuestion >=
            questions.length
        ){

            showFinal();

            return;
        }


        questionText.textContent =
            questions[currentQuestion].question;

        subtitle.textContent =
            questions[currentQuestion].subtitle;

        hint.innerHTML =
            "&nbsp;";


        noButton.style.position =
            "static";

        noButton.style.left =
            "";

        noButton.style.top =
            "";

        noButton.style.transform =
            "";


        createProgress();


        content.classList.remove("out");

        content.classList.remove(
            "question-content"
        );

        void content.offsetWidth;

        content.classList.add(
            "question-content"
        );

    },350);
}


/* =========================
   YES
========================= */

yesButton.addEventListener(
    "click",
    ()=>{

        heartExplosion();

        setTimeout(
            nextQuestion,
            550
        );

    }
);


/* =========================
   NO
========================= */

let noCount = 0;

const noMessages = [

    "Are you really sure? 🥺",

    "Maybe think about that one again... 💕",

    "Hmm... I don't believe you. 😭",

    "That answer feels suspicious. 👀",

    "I'm giving you one more chance. 🫶",

    "Okay... but my heart is still waiting. 🤍"

];


noButton.addEventListener(
    "click",
    ()=>{

        noCount++;

        hint.textContent =
            noMessages[
                Math.min(
                    noCount-1,
                    noMessages.length-1
                )
            ];


        /*
           Move button
        */

        noButton.style.position =
            "fixed";


        const padding = 20;


        const maxX =
            window.innerWidth -
            noButton.offsetWidth -
            padding;


        const maxY =
            window.innerHeight -
            noButton.offsetHeight -
            padding;


        const x =
            padding +
            Math.random() *
            Math.max(
                1,
                maxX-padding
            );


        const y =
            padding +
            Math.random() *
            Math.max(
                1,
                maxY-padding
            );


        noButton.style.transition =
            "all .5s cubic-bezier(.16,1,.3,1)";


        noButton.style.left =
            x+"px";


        noButton.style.top =
            y+"px";


        noButton.style.transform =
            "rotate("+
            (Math.random()*20-10)+
            "deg) scale(1.08)";


        setTimeout(()=>{

            noButton.style.transform =
                "rotate(0deg) scale(1)";

        },500);

    }
);


/* =========================
   FINAL SCREEN
========================= */

function showFinal(){

    questionBox.innerHTML = `

        <div class="final">

            <span class="big-heart">
                ❤️
            </span>

            <p class="eyebrow">
                maybe that's all I needed
            </p>

            <h1>
                Thank you. 💕
            </h1>

            <p class="subtitle">

                Some answers don't need
                a thousand words.

                <br><br>

                Sometimes one little
                <b>"Yes"</b>
                can make an ordinary
                moment feel special. ✨

            </p>

        </div>

    `;


    heartExplosion();

    setTimeout(
        heartExplosion,
        600
    );

    setTimeout(
        heartExplosion,
        1200
    );
}


/* =========================
   HEART PARTICLES
========================= */

function createParticle(){

    const particle =
        document.createElement("div");

    particle.className =
        "particle";


    const symbols = [
        "♡",
        "♥",
        "💕",
        "✨",
        "💗",
        "·"
    ];


    particle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    particle.style.left =
        Math.random()*100+"vw";


    particle.style.bottom =
        "-30px";


    particle.style.fontSize =
        (12+
        Math.random()*22)+"px";


    particle.style.animationDuration =
        (5+
        Math.random()*6)+"s";


    document.body.appendChild(
        particle
    );


    setTimeout(
        ()=>particle.remove(),
        12000
    );
}


/* Continuous particles */

setInterval(
    createParticle,
    650
);


/* =========================
   HEART EXPLOSION
========================= */

function heartExplosion(){

    for(
        let i=0;
        i<30;
        i++
    ){

        setTimeout(
            createParticle,
            i*30
        );
    }
}


</script>

</body>
</html>
