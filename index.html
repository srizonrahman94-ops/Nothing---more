<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Question For You 💌</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,150,205,.30),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(151,132,255,.28),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff7fb,
            #f4f1ff
        );

    position:relative;
}


/* =========================
   BACKGROUND GLOW
========================= */

.ambient{

    position:fixed;

    width:420px;
    height:420px;

    border-radius:50%;

    filter:blur(110px);

    opacity:.32;

    pointer-events:none;

    animation:
        ambientMove 12s ease-in-out infinite alternate;
}

.ambient.one{
    background:#ff82bd;
    top:-220px;
    left:-180px;
}

.ambient.two{
    background:#8f83ff;
    right:-200px;
    bottom:-220px;
    animation-delay:3s;
}

.ambient.three{

    width:260px;
    height:260px;

    background:#ffc8e4;

    left:42%;
    top:25%;

    opacity:.18;

    animation-duration:16s;
}

@keyframes ambientMove{

    0%{
        transform:
            translate(0,0)
            scale(1);
    }

    100%{
        transform:
            translate(90px,60px)
            scale(1.25);
    }

}


/* =========================
   STARS
========================= */

.star{

    position:fixed;

    width:3px;
    height:3px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 10px rgba(255,255,255,.9);

    pointer-events:none;

    opacity:0;

    animation:
        starTwinkle
        ease-in-out
        infinite;
}

@keyframes starTwinkle{

    0%,100%{
        opacity:.05;
        transform:scale(.5);
    }

    50%{
        opacity:.8;
        transform:scale(1.5);
    }

}


/* =========================
   FLOATING PARTICLES
========================= */

.particle{

    position:fixed;

    bottom:-40px;

    pointer-events:none;

    z-index:2;

    opacity:0;

    animation:
        floatUp
        linear
        forwards;
}

@keyframes floatUp{

    0%{
        opacity:0;

        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
            scale(.4);
    }

    15%{
        opacity:.7;
    }

    70%{
        opacity:.5;
    }

    100%{
        opacity:0;

        transform:
            translateY(-115vh)
            translateX(
                calc(
                    var(--drift) * 1px
                )
            )
            rotate(40deg)
            scale(1.25);
    }

}


/* =========================
   MAIN CARD
========================= */

.question{

    width:min(92%,560px);

    min-height:410px;

    padding:
        55px 35px 42px;

    position:relative;

    z-index:10;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.68),
            rgba(255,255,255,.40)
        );

    backdrop-filter:
        blur(28px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(28px)
        saturate(140%);

    border:
        1px solid rgba(255,255,255,.85);

    border-radius:36px;

    box-shadow:
        0 35px 100px
        rgba(70,45,90,.16),

        inset 0 1px 0
        rgba(255,255,255,.95),

        inset 0 -1px 0
        rgba(255,255,255,.25);

    animation:
        cardEnter
        1.2s
        cubic-bezier(.16,1,.3,1);
}

.question::before{

    content:"";

    position:absolute;

    inset:1px;

    border-radius:35px;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,.35),
            transparent 45%,
            rgba(255,255,255,.18)
        );

    pointer-events:none;
}

@keyframes cardEnter{

    0%{
        opacity:0;

        transform:
            translateY(70px)
            scale(.82)
            rotateX(8deg);
    }

    65%{
        transform:
            translateY(-7px)
            scale(1.02)
            rotateX(0);
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }

}


/* =========================
   CONTENT ANIMATION
========================= */

.question-content{

    width:100%;

    position:relative;

    z-index:3;

    animation:
        questionIn
        .75s
        cubic-bezier(.16,1,.3,1);
}

.question-content.out{

    animation:
        questionOut
        .42s
        ease
        forwards;
}

@keyframes questionIn{

    from{
        opacity:0;

        transform:
            translateY(28px)
            scale(.96)
            rotateX(-3deg);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1)
            rotateX(0);
    }

}

@keyframes questionOut{

    to{
        opacity:0;

        transform:
            translateY(-25px)
            scale(.97)
            rotateX(3deg);
    }

}


/* =========================
   TEXT
========================= */

.eyebrow{

    display:inline-block;

    font-size:11px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#a56b91;

    margin-bottom:18px;

    opacity:.9;
}

h1{

    font-size:
        clamp(
            31px,
            7vw,
            52px
        );

    line-height:1.08;

    letter-spacing:-1.5px;

    color:#403445;

    margin-bottom:20px;
}

.subtitle{

    max-width:420px;

    margin:
        0 auto 32px;

    color:#7d6d7b;

    font-size:15px;

    line-height:1.75;
}


/* =========================
   BUTTONS
========================= */

.btn-row{

    min-height:58px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:14px;
}

button{

    border:none;

    outline:none;

    cursor:pointer;

    min-width:125px;

    padding:
        15px 28px;

    border-radius:50px;

    font-size:16px;

    font-weight:650;

    transition:
        transform .28s cubic-bezier(.16,1,.3,1),
        box-shadow .28s ease,
        opacity .25s ease;

    -webkit-tap-highlight-color:transparent;
}


/* =========================
   YES BUTTON
========================= */

.yes{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff73ae,
            #ff3d82
        );

    box-shadow:
        0 12px 30px
        rgba(255,70,135,.28);

    animation:
        yesPulse
        2.6s
        ease-in-out
        infinite;
}

@keyframes yesPulse{

    0%,100%{
        box-shadow:
            0 12px 30px
            rgba(255,70,135,.22);
    }

    50%{
        box-shadow:
            0 14px 38px
            rgba(255,70,135,.40),

            0 0 0 8px
            rgba(255,70,135,.06);
    }

}

.yes:hover{

    transform:
        translateY(-5px)
        scale(1.05);
}

.yes:active{

    transform:
        scale(.91);
}


/* =========================
   NO BUTTON
========================= */

.no{

    color:#655767;

    background:
        rgba(255,255,255,.82);

    box-shadow:
        0 8px 22px
        rgba(40,30,50,.08);
}

.no:hover{

    transform:
        translateY(-4px);
}

.no:active{

    transform:
        scale(.92);
}


/* =========================
   HINT
========================= */

.hint{

    min-height:25px;

    margin-top:21px;

    font-size:14px;

    color:#a16b89;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =========================
   PROGRESS
========================= */

.progress{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:6px;

    margin-top:27px;
}

.dot{

    width:6px;
    height:6px;

    border-radius:10px;

    background:#dcd3dc;

    transition:
        all .45s
        cubic-bezier(.16,1,.3,1);
}

.dot.active{

    width:24px;

    background:#ff6aa6;

    box-shadow:
        0 0 10px
        rgba(255,106,166,.3);
}


/* =========================
   FINAL SCREEN
========================= */

.final{

    width:100%;

    animation:
        finalReveal
        1.1s
        cubic-bezier(.16,1,.3,1);
}

@keyframes finalReveal{

    0%{
        opacity:0;

        transform:
            scale(.55)
            translateY(35px);

        filter:blur(8px);
    }

    65%{
        transform:
            scale(1.05);

        filter:blur(0);
    }

    100%{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}

.big-heart{

    display:block;

    font-size:78px;

    margin-bottom:15px;

    filter:
        drop-shadow(
            0 12px 20px
            rgba(255,70,130,.2)
        );

    animation:
        heartbeat
        1.7s
        ease-in-out
        infinite;
}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    12%{
        transform:scale(1.17);
    }

    25%{
        transform:scale(1);
    }

    38%{
        transform:scale(1.10);
    }

    52%{
        transform:scale(1);
    }

}

.final-quote{

    max-width:420px;

    margin:0 auto;

    color:#756574;

    font-size:15px;

    line-height:1.8;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .question{

        width:92%;

        min-height:390px;

        padding:
            45px 22px 35px;

        border-radius:29px;
    }

    .question::before{

        border-radius:28px;
    }

    .btn-row{

        gap:10px;
    }

    button{

        min-width:105px;

        padding:
            13px 19px;

        font-size:15px;
    }

    .subtitle{

        font-size:14px;
    }

}

</style>
</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div class="ambient one"></div>
<div class="ambient two"></div>
<div class="ambient three"></div>


<!-- =========================
     MAIN CARD
========================= -->

<div
    class="question"
    id="questionBox"
>

    <div
        class="question-content"
        id="content"
    >

        <p class="eyebrow">
            just a little question
        </p>

        <h1 id="questionText">
            Would you love me? ❤️
        </h1>

        <p
            class="subtitle"
            id="subtitle"
        >
            No pressure...
            just answer from your heart. 🤍
        </p>

        <div class="btn-row">

            <button
                class="yes"
                id="yesButton"
                type="button"
            >
                Yes ❤️
            </button>

            <button
                class="no"
                id="noButton"
                type="button"
            >
                No
            </button>

        </div>

        <p
            class="hint"
            id="hint"
        >
            &nbsp;
        </p>

        <div
            class="progress"
            id="progress"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        question:
            "Would you love me? ❤️",

        subtitle:
            "No pressure... just answer from your heart. 🤍"
    },

    {
        question:
            "Would you choose me again? 🫶",

        subtitle:
            "Even if you had to meet me all over again?"
    },

    {
        question:
            "Would you smile when you see my name? 😊",

        subtitle:
            "Be honest... I promise I won't judge."
    },

    {
        question:
            "Would you keep our little moments in your memory? 🌷",

        subtitle:
            "Some moments may be small, but they can still mean a lot."
    },

    {
        question:
            "Would you still be there on the difficult days? 🌙",

        subtitle:
            "Because meaningful connections aren't only about the easy days."
    },

    {
        question:
            "Would you save a special place for me? 💗",

        subtitle:
            "Not a huge place... just somewhere I can belong."
    },

    {
        question:
            "If we could make one more beautiful memory, would you? ✨",

        subtitle:
            "Sometimes the simplest moments become our favorite ones."
    },

    {
        question:
            "Would you choose happiness with me? 🌸",

        subtitle:
            "Because seeing someone happy can be a beautiful thing."
    },

    {
        question:
            "One last question... 💌",

        subtitle:
            "If this little journey made you smile, would you stay for the final surprise?"
    }

];


let currentQuestion = 0;
let noCount = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const questionBox =
    document.getElementById("questionBox");

const content =
    document.getElementById("content");

const questionText =
    document.getElementById("questionText");

const subtitle =
    document.getElementById("subtitle");

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");

const hint =
    document.getElementById("hint");

const progress =
    document.getElementById("progress");


/* =====================================================
   AUDIO SYSTEM
===================================================== */

let audioContext = null;


/* Create audio only after user interaction */

function initAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}


/* =====================================================
   YES SOUND
   Soft romantic magical chime
===================================================== */

function playYesSound(){

    initAudio();

    const now =
        audioContext.currentTime;


    const master =
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );

    master.gain.linearRampToValueAtTime(
        0.18,
        now + 0.04
    );

    master.gain.exponentialRampToValueAtTime(
        0.001,
        now + 1.8
    );


    master.connect(
        audioContext.destination
    );


    const notes = [

        523.25,
        659.25,
        783.99,
        1046.50

    ];


    notes.forEach(
        (frequency,index)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                frequency,
                now
            );


            oscillator.frequency.exponentialRampToValueAtTime(
                frequency * 1.01,
                now + 0.8
            );


            gain.gain.setValueAtTime(
                0,
                now + index * 0.08
            );

            gain.gain.linearRampToValueAtTime(
                0.8,
                now + index * 0.08 + 0.04
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + 1.6
            );


            oscillator.connect(gain);
            gain.connect(master);


            oscillator.start(
                now + index * 0.08
            );

            oscillator.stop(
                now + 1.8
            );

        }
    );

}


/* =====================================================
   NO SOUND
   Soft sad descending tone
===================================================== */

function playNoSound(){

    initAudio();

    const now =
        audioContext.currentTime;


    const master =
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );

    master.gain.linearRampToValueAtTime(
        0.16,
        now + 0.05
    );

    master.gain.exponentialRampToValueAtTime(
        0.001,
        now + 1.5
    );


    master.connect(
        audioContext.destination
    );


    const notes = [

        440.00,
        349.23,
        293.66

    ];


    notes.forEach(
        (frequency,index)=>{

            const oscillator =
                audioContext.createOscillator();

            const gain =
                audioContext.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.setValueAtTime(
                frequency,
                now + index * 0.16
            );


            gain.gain.setValueAtTime(
                0,
                now + index * 0.16
            );

            gain.gain.linearRampToValueAtTime(
                0.65,
                now + index * 0.16 + 0.04
            );

            gain.gain.exponentialRampToValueAtTime(
                0.001,
                now + index * 0.16 + 0.7
            );


            oscillator.connect(gain);
            gain.connect(master);


            oscillator.start(
                now + index * 0.16
            );

            oscillator.stop(
                now + index * 0.16 + 0.75
            );

        }
    );

}


/* =====================================================
   PROGRESS
===================================================== */

function createProgress(){

    progress.innerHTML = "";

    questions.forEach(
        (_,index)=>{

            const dot =
                document.createElement(
                    "span"
                );

            dot.className =
                "dot";


            if(
                index ===
                currentQuestion
            ){

                dot.classList.add(
                    "active"
                );

            }


            progress.appendChild(
                dot
            );

        }
    );

}

createProgress();


/* =====================================================
   RESET NO BUTTON
===================================================== */

function resetNoButton(){

    noButton.style.position =
        "static";

    noButton.style.left =
        "";

    noButton.style.top =
        "";

    noButton.style.transform =
        "";

    noButton.style.transition =
        "";

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    content.classList.add(
        "out"
    );


    setTimeout(()=>{

        currentQuestion++;


        if(
            currentQuestion >=
            questions.length
        ){

            showFinal();

            return;

        }


        questionText.textContent =
            questions[
                currentQuestion
            ].question;


        subtitle.textContent =
            questions[
                currentQuestion
            ].subtitle;


        hint.innerHTML =
            "&nbsp;";


        resetNoButton();


        createProgress();


        content.classList.remove(
            "out"
        );


        content.classList.remove(
            "question-content"
        );


        void content.offsetWidth;


        content.classList.add(
            "question-content"
        );


    },420);

}


/* =====================================================
   YES BUTTON
===================================================== */

yesButton.addEventListener(
    "click",
    ()=>{

        /* Romantic sound */
        playYesSound();

        /* Heart animation */
        heartExplosion();

        /* Prevent accidental double clicks */
        yesButton.disabled =
            true;


        setTimeout(
            nextQuestion,
            480
        );


        setTimeout(
            ()=>{
                yesButton.disabled =
                    false;
            },
            900
        );

    }
);


/* =====================================================
   NO BUTTON
===================================================== */

const noMessages = [

    "Are you really sure? 🥺",

    "Maybe give that answer another thought... 💕",

    "Hmm... I'm not convinced. 👀",

    "That answer was a little unexpected. 😭",

    "I'll pretend I didn't hear that. 😂",

    "Okay... one more chance? 🫶",

    "My little button is getting nervous now. 🤍"

];


noButton.addEventListener(
    "click",
    ()=>{

        /* Sad sound */
        playNoSound();


        noCount++;


        hint.textContent =
            noMessages[
                Math.min(
                    noCount - 1,
                    noMessages.length - 1
                )
            ];


        noButton.style.position =
            "fixed";


        const padding = 20;


        const maxX =
            window.innerWidth -
            noButton.offsetWidth -
            padding;


        const maxY =
            window.innerHeight -
            noButton.offsetHeight -
            padding;


        const x =
            padding +
            Math.random() *
            Math.max(
                1,
                maxX - padding
            );


        const y =
            padding +
            Math.random() *
            Math.max(
                1,
                maxY - padding
            );


        noButton.style.transition =
            "left .55s cubic-bezier(.16,1,.3,1), top .55s cubic-bezier(.16,1,.3,1), transform .3s ease";


        noButton.style.left =
            x + "px";


        noButton.style.top =
            y + "px";


        noButton.style.transform =
            "rotate(" +
            (
                Math.random() * 20 - 10
            ) +
            "deg) scale(1.08)";


        setTimeout(()=>{

            noButton.style.transform =
                "rotate(0deg) scale(1)";

        },550);

    }
);


/* =====================================================
   FINAL SCREEN
===================================================== */

function showFinal(){

    questionBox.innerHTML = `

        <div class="final">

            <span class="big-heart">
                ❤️
            </span>

            <p class="eyebrow">
                the little journey ends here
            </p>

            <h1>
                Thank You. 💕
            </h1>

            <p class="final-quote">

                Some moments don't need
                a perfect explanation.

                <br><br>

                Sometimes a simple answer,
                a little smile,
                or one beautiful memory
                is enough to make a moment
                feel special.

                <br><br>

                ✨ Keep smiling. ✨

            </p>

        </div>

    `;


    heartExplosion();


    setTimeout(
        heartExplosion,
        500
    );


    setTimeout(
        heartExplosion,
        1000
    );


    setTimeout(
        heartExplosion,
        1600
    );

}


/* =====================================================
   PARTICLES
===================================================== */

const symbols = [

    "♡",
    "♥",
    "💕",
    "💗",
    "✨",
    "✦",
    "·"

];


function createParticle(){

    const particle =
        document.createElement(
            "div"
        );


    particle.className =
        "particle";


    particle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    particle.style.left =
        Math.random() * 100 +
        "vw";


    particle.style.fontSize =
        (
            10 +
            Math.random() * 22
        ) +
        "px";


    particle.style.animationDuration =
        (
            5 +
            Math.random() * 7
        ) +
        "s";


    particle.style.setProperty(
        "--drift",
        Math.random() * 160 - 80
    );


    document.body.appendChild(
        particle
    );


    setTimeout(
        ()=>{
            particle.remove();
        },
        13000
    );

}


/* =====================================================
   CONTINUOUS PARTICLES
===================================================== */

setInterval(
    createParticle,
    700
);


/* =====================================================
   HEART EXPLOSION
===================================================== */

function heartExplosion(){

    for(
        let i = 0;
        i < 35;
        i++
    ){

        setTimeout(
            createParticle,
            i * 25
        );

    }

}


/* =====================================================
   CREATE STARS
===================================================== */

function createStars(){

    for(
        let i = 0;
        i < 45;
        i++
    ){

        const star =
            document.createElement(
                "div"
            );


        star.className =
            "star";


        star.style.left =
            Math.random() * 100 +
            "vw";


        star.style.top =
            Math.random() * 100 +
            "vh";


        star.style.animationDuration =
            (
                2 +
                Math.random() * 4
            ) +
            "s";


        star.style.animationDelay =
            (
                Math.random() * 4
            ) +
            "s";


        document.body.appendChild(
            star
        );

    }

}

createStars();


</script>

</body>
</html>
