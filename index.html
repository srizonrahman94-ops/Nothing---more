<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>একটু প্রশ্ন... 💌</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    min-height:100vh;

    overflow:hidden;

    display:flex;

    align-items:center;
    justify-content:center;

    font-family:
        "Noto Sans Bengali",
        "Hind Siliguri",
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,130,190,.28),
            transparent 34%
        ),
        radial-gradient(
            circle at 85% 85%,
            rgba(135,120,255,.25),
            transparent 36%
        ),
        linear-gradient(
            135deg,
            #fff6fa,
            #f5f2ff
        );

    position:relative;

    -webkit-font-smoothing:antialiased;

}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.glow{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    filter:blur(90px);

    will-change:transform;

    transform:translate3d(0,0,0);

}

.glow1{

    width:380px;
    height:380px;

    left:-180px;
    top:-150px;

    background:#ff7eb7;

    opacity:.28;

    animation:
        glowOne
        14s
        ease-in-out
        infinite
        alternate;
}

.glow2{

    width:380px;
    height:380px;

    right:-180px;
    bottom:-180px;

    background:#8d7dff;

    opacity:.25;

    animation:
        glowTwo
        16s
        ease-in-out
        infinite
        alternate;
}

@keyframes glowOne{

    from{
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to{
        transform:
            translate3d(80px,60px,0)
            scale(1.18);
    }
}

@keyframes glowTwo{

    from{
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to{
        transform:
            translate3d(-70px,-55px,0)
            scale(1.2);
    }
}


/* =========================================================
   CARD
========================================================= */

.card{

    width:min(92%,570px);

    min-height:430px;

    padding:
        50px 28px 36px;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;

    z-index:10;

    border-radius:34px;

    background:
        rgba(255,255,255,.64);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);

    border:
        1px solid
        rgba(255,255,255,.82);

    box-shadow:
        0 28px 80px
        rgba(70,45,90,.15),

        inset 0 1px 0
        rgba(255,255,255,.9);

    transform:
        translate3d(0,0,0);

    will-change:
        transform;

    animation:
        cardAppear
        .9s
        cubic-bezier(.22,1,.36,1);

}

@keyframes cardAppear{

    0%{

        opacity:0;

        transform:
            translate3d(0,45px,0)
            scale(.94);

    }

    100%{

        opacity:1;

        transform:
            translate3d(0,0,0)
            scale(1);

    }

}


/* =========================================================
   CONTENT
========================================================= */

.content{

    width:100%;

    opacity:1;

    transform:
        translate3d(0,0,0)
        scale(1);

    will-change:
        transform,
        opacity,
        filter;

}


/* Exit animation */

.content.exit{

    animation:
        questionExit
        .28s
        cubic-bezier(.4,0,1,1)
        forwards;

}


/* Enter animation */

.content.enter{

    animation:
        questionEnter
        .48s
        cubic-bezier(.22,1,.36,1)
        forwards;

}


@keyframes questionExit{

    0%{

        opacity:1;

        transform:
            translate3d(0,0,0)
            scale(1);

        filter:
            blur(0);

    }

    100%{

        opacity:0;

        transform:
            translate3d(0,-14px,0)
            scale(.975);

        filter:
            blur(3px);

    }

}


@keyframes questionEnter{

    0%{

        opacity:0;

        transform:
            translate3d(0,18px,0)
            scale(.975);

        filter:
            blur(3px);

    }

    100%{

        opacity:1;

        transform:
            translate3d(0,0,0)
            scale(1);

        filter:
            blur(0);

    }

}


/* =========================================================
   TEXT
========================================================= */

.eyebrow{

    display:inline-block;

    margin-bottom:16px;

    color:#a56c91;

    font-size:11px;

    letter-spacing:3px;

    text-transform:uppercase;

}

h1{

    color:#403344;

    font-size:
        clamp(
            29px,
            7vw,
            48px
        );

    line-height:1.2;

    letter-spacing:-.7px;

    margin-bottom:17px;

}

.subtitle{

    max-width:440px;

    margin:
        0 auto 30px;

    color:#7b6b7a;

    font-size:15px;

    line-height:1.8;

}


/* =========================================================
   BUTTONS
========================================================= */

.buttons{

    min-height:58px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

}


button{

    min-width:120px;

    padding:
        14px 25px;

    border:0;

    outline:0;

    border-radius:50px;

    font-family:inherit;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    user-select:none;

    -webkit-user-select:none;

    -webkit-tap-highlight-color:transparent;

    will-change:
        transform;

    transform:
        translate3d(0,0,0);

}


/* =========================================================
   YES
========================================================= */

#yes{

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff78b5,
            #ff3c81
        );

    box-shadow:
        0 10px 28px
        rgba(255,60,130,.25);

    animation:
        yesBreath
        2.8s
        ease-in-out
        infinite;

}


@keyframes yesBreath{

    0%,100%{

        box-shadow:
            0 10px 28px
            rgba(255,60,130,.22);

    }

    50%{

        box-shadow:
            0 14px 34px
            rgba(255,60,130,.34);

    }

}


#yes:hover{

    transform:
        translate3d(0,-3px,0)
        scale(1.04);

}


#yes:active{

    transform:
        translate3d(0,1px,0)
        scale(.94);

}


/* =========================================================
   NO
========================================================= */

#no{

    color:#665767;

    background:
        rgba(255,255,255,.88);

    box-shadow:
        0 8px 20px
        rgba(50,35,60,.08);

    position:relative;

    transform:
        translate3d(0,0,0);

}


#no:hover{

    transform:
        translate3d(0,-3px,0);

}


#no:active{

    transform:
        scale(.94);

}


/* =========================================================
   HINT
========================================================= */

.hint{

    min-height:25px;

    margin-top:19px;

    color:#a06b88;

    font-size:14px;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    margin-top:25px;

    height:7px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:6px;

}

.dot{

    width:6px;

    height:6px;

    border-radius:20px;

    background:#ddd4dc;

    transition:
        width .35s ease,
        background .35s ease;

}

.dot.active{

    width:23px;

    background:#ff69a5;

}


/* =========================================================
   PARTICLES
========================================================= */

.particle{

    position:fixed;

    left:0;

    top:0;

    pointer-events:none;

    z-index:30;

    will-change:
        transform,
        opacity;

    transform:
        translate3d(0,0,0);

}


/* =========================================================
   FINAL
========================================================= */

.final{

    width:100%;

    animation:
        finalEnter
        .8s
        cubic-bezier(.22,1,.36,1);

}

@keyframes finalEnter{

    from{

        opacity:0;

        transform:
            translate3d(0,25px,0)
            scale(.94);

    }

    to{

        opacity:1;

        transform:
            translate3d(0,0,0)
            scale(1);

    }

}

.final-heart{

    display:block;

    font-size:78px;

    margin-bottom:15px;

    animation:
        heartbeat
        1.7s
        ease-in-out
        infinite;

}

@keyframes heartbeat{

    0%,100%{
        transform:scale(1);
    }

    15%{
        transform:scale(1.16);
    }

    30%{
        transform:scale(1);
    }

    45%{
        transform:scale(1.08);
    }

}

.final-text{

    max-width:430px;

    margin:auto;

    color:#766674;

    font-size:15px;

    line-height:1.9;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:520px){

    .card{

        width:92%;

        min-height:410px;

        padding:
            42px 20px 30px;

        border-radius:29px;

    }

    .buttons{

        gap:8px;

    }

    button{

        min-width:105px;

        padding:
            13px 18px;

        font-size:15px;

    }

    .subtitle{

        font-size:14px;

    }

}

</style>
</head>


<body>


<!-- BACKGROUND -->

<div class="glow glow1"></div>
<div class="glow glow2"></div>


<!-- CARD -->

<div class="card" id="card">

    <div class="content" id="content">

        <p class="eyebrow">
            তোমার জন্য ছোট্ট কিছু প্রশ্ন 💌
        </p>

        <h1 id="question">
            তুমি কি আমাকে ভালোবাসবে? ❤️
        </h1>

        <p class="subtitle" id="subtitle">
            কোনো চাপ নেই...
            শুধু মন থেকে উত্তর দিও। 🤍
        </p>

        <div class="buttons">

            <button
                id="yes"
                type="button"
            >
                হ্যাঁ ❤️
            </button>

            <button
                id="no"
                type="button"
            >
                না
            </button>

        </div>

        <p
            class="hint"
            id="hint"
        >
            &nbsp;
        </p>

        <div
            class="progress"
            id="progress"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   QUESTIONS
========================================================= */

const questions = [

    [
        "তুমি কি আমাকে ভালোবাসবে? ❤️",
        "কোনো চাপ নেই... শুধু মন থেকে উত্তর দিও। 🤍"
    ],

    [
        "আবার যদি প্রথমবার দেখা হতো,তাহলে কি আমাকে বেছে নিতে? 🫶",
        "সবকিছু নতুন করে শুরু করার সুযোগ পেলে?"
    ],

    [
        "আমার নাম দেখলে কি তোমার মুখে একটু হাসি আসে? 😊",
        "সত্যি করে বলো... তোমার উত্তরটা জানতে ইচ্ছে করছে।"
    ],

    [
        "আমাদের ছোট ছোট মুহূর্তগুলো কি তুমি মনে রাখবে? 🌷",
        "কিছু মুহূর্ত ছোট হলেও,মনের কাছে অনেক বড় হয়ে থাকে।"
    ],

    [
        "মন খারাপের দিনে কি আমার সঙ্গে একটু কথা বলতে চাইবে? 🌙",
        "কখনো কখনো একটা ছোট্ট কথাই মনটা ভালো করে দিতে পারে।"
    ],

    [
        "কঠিন সময় এলেও কি আমার পাশে থাকবে? 🤍",
        "কারণ সুন্দর সম্পর্ক শুধু ভালো সময়ের জন্য নয়।"
    ],

    [
        "তোমার হৃদয়ে কি আমার জন্য একটু বিশেষ জায়গা থাকবে? 💗",
        "খুব বেশি জায়গা নয়... শুধু একটু বিশেষ জায়গা।"
    ],

    [
        "আমার সঙ্গে আরও অনেক সুন্দর স্মৃতি তৈরি করতে চাইবে? ✨",
        "হয়তো আজকের এই মুহূর্তটাও একদিন সুন্দর স্মৃতি হয়ে যাবে।"
    ],

    [
        "আমার সঙ্গে হাসতে,গল্প করতে আর সুন্দর সময় কাটাতে চাইবে? 🌸",
        "কারণ সুন্দর সময় ভাগ করে নিলে মুহূর্তগুলো আরও সুন্দর হয়।"
    ],

    [
        "শেষ একটা প্রশ্ন...আমি যদি তোমাকে থাকতে বলি,তুমি কি থাকবে? 💌",
        "এই প্রশ্নটার উত্তরটাই হয়তো সবচেয়ে বেশি জানতে ইচ্ছে করছে।"
    ]

];


let current=0;

let noCount=0;

let audio=null;

let audioReady=false;


/* =========================================================
   ELEMENTS
========================================================= */

const card=
    document.getElementById("card");

const content=
    document.getElementById("content");

const question=
    document.getElementById("question");

const subtitle=
    document.getElementById("subtitle");

const yes=
    document.getElementById("yes");

const no=
    document.getElementById("no");

const hint=
    document.getElementById("hint");

const progress=
    document.getElementById("progress");


/* =========================================================
   PROGRESS
========================================================= */

function progressDots(){

    progress.innerHTML="";

    for(
        let i=0;
        i<questions.length;
        i++
    ){

        const dot=
            document.createElement("span");

        dot.className="dot";

        if(i===current){

            dot.classList.add("active");

        }

        progress.appendChild(dot);

    }

}

progressDots();


/* =========================================================
   AUDIO INITIALIZE
========================================================= */

function initAudio(){

    if(!audio){

        audio=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audio.state===
        "suspended"
    ){

        audio.resume();

    }

}


/* =========================================================
   SIMPLE SOFT TONE
========================================================= */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    initAudio();

    const now=
        audio.currentTime;

    const osc=
        audio.createOscillator();

    const gain=
        audio.createGain();


    osc.type=type;

    osc.frequency.setValueAtTime(
        frequency,
        now
    );


    gain.gain.setValueAtTime(
        0,
        now
    );


    gain.gain.linearRampToValueAtTime(
        volume,
        now+.025
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        now+duration
    );


    osc.connect(gain);

    gain.connect(
        audio.destination
    );


    osc.start(now);

    osc.stop(
        now+duration+.03
    );

}


/* =========================================================
   YES SOUND
========================================================= */

function yesSound(){

    tone(
        523.25,
        .7,
        .11
    );

    setTimeout(
        ()=>{
            tone(
                659.25,
                .8,
                .10
            );
        },
        70
    );

    setTimeout(
        ()=>{
            tone(
                783.99,
                1,
                .09
            );
        },
        140
    );

    setTimeout(
        ()=>{
            tone(
                1046.5,
                1.2,
                .07
            );
        },
        210
    );

}


/* =========================================================
   NO SOUND
========================================================= */

function noSound(){

    tone(
        440,
        .45,
        .08
    );

    setTimeout(
        ()=>{
            tone(
                392,
                .55,
                .07
            );
        },
        100
    );

    setTimeout(
        ()=>{
            tone(
                329.63,
                .7,
                .06
            );
        },
        200
    );

}


/* =========================================================
   BACKGROUND AMBIENCE
========================================================= */

let ambientStarted=false;

function startAmbient(){

    initAudio();

    if(ambientStarted)
        return;

    ambientStarted=true;

    /*
       Very quiet background tone.
       No loop-heavy processing.
    */

    tone(
        261.63,
        3,
        .015
    );

}


/* =========================================================
   BUTTON PRESS
========================================================= */

function pressEffect(button){

    button.animate(

        [
            {
                transform:
                    "translate3d(0,0,0) scale(1)"
            },

            {
                transform:
                    "translate3d(0,1px,0) scale(.94)"
            },

            {
                transform:
                    "translate3d(0,0,0) scale(1)"
            }
        ],

        {
            duration:220,

            easing:
                "cubic-bezier(.22,1,.36,1)"
        }

    );

}


/* =========================================================
   YES
========================================================= */

yes.addEventListener(
    "click",
    ()=>{

        if(
            content.classList.contains("exit")
        )
            return;


        initAudio();

        startAmbient();

        yesSound();

        pressEffect(yes);

        heartBurst(
            window.innerWidth/2,
            window.innerHeight/2
        );


        setTimeout(
            nextQuestion,
            360
        );

    }
);


/* =========================================================
   NO MESSAGES
========================================================= */

const noMessages=[

    "সত্যিই? 🥺",

    "আরেকবার ভেবে দেখবে? 💕",

    "এই উত্তরটা কিন্তু আমার মন মানছে না। 🥹",

    "তুমি কি নিশ্চিত? 👀",

    "আমার মনে হচ্ছে তুমি একটু দুষ্টুমি করছো। 😭",

    "আরেকটা সুযোগ নাও... 🫶",

    "শেষবারের মতো ভেবে দেখো। 🤍"

];


/* =========================================================
   NO BUTTON SMOOTH MOVE
========================================================= */

function moveNoButton(){

    const rect=
        no.getBoundingClientRect();


    const padding=18;


    const maxX=
        window.innerWidth-
        rect.width-
        padding;


    const maxY=
        window.innerHeight-
        rect.height-
        padding;


    const x=
        padding+
        Math.random()*
        Math.max(
            1,
            maxX-padding
        );


    const y=
        padding+
        Math.random()*
        Math.max(
            1,
            maxY-padding
        );


    /*
       IMPORTANT:

       শুধুমাত্র transform ব্যবহার করা হচ্ছে।
       left/top নয়।

       এতে layout reflow কম হয়
       এবং animation বেশি smooth হয়।
    */

    no.style.position="fixed";

    no.style.left="0";

    no.style.top="0";

    no.style.transform=

        `translate3d(
            ${x}px,
            ${y}px,
            0
        ) rotate(
            ${Math.random()*14-7}deg
        ) scale(1.05)`;


    no.animate(

        [
            {
                transform:
                    `translate3d(
                        ${x}px,
                        ${y}px,
                        0
                    )
                    rotate(0deg)
                    scale(.96)`
            },

            {
                transform:
                    `translate3d(
                        ${x}px,
                        ${y}px,
                        0
                    )
                    rotate(0deg)
                    scale(1.05)`
            },

            {
                transform:
                    `translate3d(
                        ${x}px,
                        ${y}px,
                        0
                    )
                    rotate(0deg)
                    scale(1)`
            }
        ],

        {
            duration:520,

            easing:
                "cubic-bezier(.22,1,.36,1)"
        }

    );

}


/* =========================================================
   NO
========================================================= */

no.addEventListener(
    "click",
    ()=>{

        initAudio();

        startAmbient();

        noSound();

        pressEffect(no);


        noCount++;


        hint.textContent=
            noMessages[
                Math.min(
                    noCount-1,
                    noMessages.length-1
                )
            ];


        moveNoButton();


        /*
           Small sad particle burst
        */

        smallBurst();

    }
);


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    content.classList.remove("enter");

    content.classList.add("exit");


    setTimeout(
        ()=>{

            current++;


            if(
                current>=
                questions.length
            ){

                showFinal();

                return;

            }


            question.textContent=
                questions[current][0];


            subtitle.textContent=
                questions[current][1];


            hint.innerHTML=
                "&nbsp;";


            /*
               Reset No button
            */

            no.style.position="relative";

            no.style.left="";

            no.style.top="";

            no.style.transform=
                "translate3d(0,0,0)";


            content.classList.remove(
                "exit"
            );

            /*
               Force animation restart
            */

            void content.offsetWidth;

            content.classList.add(
                "enter"
            );


            progressDots();


        },
        280
    );

}


/* =========================================================
   GPU FRIENDLY PARTICLE
========================================================= */

const particleSymbols=[

    "♡",
    "♥",
    "✨",
    "✦",
    "·"

];


function createParticle(
    startX,
    startY
){

    const el=
        document.createElement(
            "div"
        );


    el.className="particle";


    el.textContent=
        particleSymbols[
            Math.floor(
                Math.random()*
                particleSymbols.length
            )
        ];


    const size=
        12+
        Math.random()*18;


    const angle=
        Math.random()*
        Math.PI*
        2;


    const distance=
        50+
        Math.random()*120;


    const endX=
        Math.cos(angle)*
        distance;


    const endY=
        Math.sin(angle)*
        distance;


    el.style.fontSize=
        size+"px";


    el.style.left=
        startX+"px";


    el.style.top=
        startY+"px";


    document.body.appendChild(
        el
    );


    const animation=
        el.animate(

            [

                {
                    transform:
                        "translate3d(0,0,0) scale(.3)",

                    opacity:0
                },

                {
                    transform:
                        "translate3d(0,0,0) scale(1)",

                    opacity:.9,

                    offset:.15
                },

                {
                    transform:
                        `translate3d(
                            ${endX}px,
                            ${endY}px,
                            0
                        ) scale(.8)`,

                    opacity:0
                }

            ],

            {

                duration:
                    700+
                    Math.random()*500,

                easing:
                    "cubic-bezier(.22,1,.36,1)",

                fill:"forwards"

            }

        );


    animation.finished.then(
        ()=>{
            el.remove();
        }
    );

}


/* =========================================================
   HEART BURST
========================================================= */

function heartBurst(x,y){

    /*
       Only 16 particles.
       Enough for visual impact
       without creating lag.
    */

    for(
        let i=0;
        i<16;
        i++
    ){

        setTimeout(
            ()=>{
                createParticle(
                    x,
                    y
                );
            },
            i*18
        );

    }

}


/* =========================================================
   SMALL BURST
========================================================= */

function smallBurst(){

    const rect=
        no.getBoundingClientRect();


    const x=
        rect.left+
        rect.width/2;


    const y=
        rect.top+
        rect.height/2;


    for(
        let i=0;
        i<6;
        i++
    ){

        createParticle(
            x,
            y
        );

    }

}

/* =========================================================
   PREVENT DOUBLE CLICK GLITCH
========================================================= */

let lastClick=0;

document.addEventListener(
    "click",
    ()=>{
        const now=
            performance.now();

        if(
            now-lastClick<40
        ){

            return;

        }

        lastClick=now;

    },
    {
        passive:true
    }
);
